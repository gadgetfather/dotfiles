#
# [[on-window-detected]]
#     if.app-id = 'com.google.Chrome.app.icloud'
#     run = 'move-node-to-workspace M'  # M = Mail/Meet (adjust app-id for your client)

# ------------------------------------------------------------------------------------
# Always keep Finder floating
# ------------------------------------------------------------------------------------
[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'
