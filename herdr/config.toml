# herdr configuration — tuned for running many Claude Code sessions
# Docs: https://herdr.dev/docs/    Reload after edits: herdr server reload-config
# See all defaults: herdr --default-config

onboarding = false

[theme]
name = "catppuccin"
# Follow Ghostty's light/dark appearance automatically.
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[terminal]
shell_mode = "auto"
# New panes/tabs inherit the cwd of the pane you split from, so a new pane in a
# project workspace is already in that repo.
new_cwd = "follow"

[keys]
# AeroSpace now uses ALT as its primary modifier, so ctrl is free again.
# ctrl+b (herdr's default) is still avoided: Claude Code uses Ctrl+B to background
# a Bash task, and sharing it means pressing it twice inside every Claude pane.
# ctrl+g is unbound in AeroSpace, the shell, and Claude Code.
prefix = "ctrl+g"

# --- workspaces (one per repo) ---
new_workspace     = "prefix+shift+n"
workspace_picker  = "prefix+w"
rename_workspace  = "prefix+shift+w"
close_workspace   = "prefix+shift+d"
previous_workspace = "prefix+shift+k"
next_workspace     = "prefix+shift+j"
switch_workspace   = "prefix+shift+1..9"

# --- agents (jump straight to the Claude session that needs you) ---
previous_agent = "prefix+["
next_agent     = "prefix+]"
focus_agent    = ""   # alt+1..9 is AeroSpace workspaces; use prefix+[ / prefix+]

# --- git worktrees (parallel Claude sessions on one repo) ---
new_worktree    = "prefix+shift+g"
open_worktree   = "prefix+shift+o"
remove_worktree = "prefix+shift+r"

# --- tabs ---
new_tab      = "prefix+c"
rename_tab   = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab     = "prefix+n"
switch_tab   = "prefix+1..9"
close_tab    = "prefix+shift+x"

# --- panes (vim-style focus) ---
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical   = "prefix+v"
split_horizontal = "prefix+minus"
close_pane       = "prefix+x"
zoom             = "prefix+z"
last_pane        = "prefix+tab"
resize_mode      = "prefix+r"
rename_pane      = "prefix+shift+p"

# --- session ---
detach                   = "prefix+q"
help                     = "prefix+?"
settings                 = "prefix+s"
reload_config            = "prefix+shift+comma"
toggle_sidebar           = "prefix+b"
open_notification_target = "prefix+o"
edit_scrollback          = "prefix+e"

# Popup: git status/log for the focused pane's repo, without disturbing layout.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "git status --short --branch && echo && git log --oneline --graph -15 && echo && read -n 1 -s -r -p 'any key to close'"
width = "80%"
height = "70%"

[ui]
# T3 Code-style sidebar: one flat list of sessions, ordered as an attention
# queue (blocked first, then done, then working), like T3's thread inbox.
# Use "spaces" to group by repo instead (T3's "group by project" mode).
agent_panel_sort = "priority"

# T3 shows a coloured dot plus a status label. The label (state_text, below)
# carries the meaning, so colour-only dots stay readable for colourblind users.
status_indicators = "dots"

# Label each split with its detected agent, so you can tell two Claude panes apart.
show_agent_labels_on_pane_borders = true

# Wider than default so session titles, the headline of each row, fit.
sidebar_width = 34
sidebar_max_width = 44
confirm_close = true
prompt_new_tab_name = false
prompt_new_workspace_name = true
hide_tab_bar_when_single_tab = true

# Ghostty tab/window title shows which repo you're in.
window_title = "herdr — {workspace}"


# Sidebar rows, modelled on T3 Code's thread rows:
#   line 1  ● session title            (the thread title, bold)
#   line 2  status · repo · tab         (status pill colour, the rest muted)
# Claude Code writes its current task into the terminal title, so
# terminal_title_stripped is a live title for each session.
# Status colours follow T3: blocked = amber (needs approval/input),
# working = sky, done = green, idle shows no label. Catppuccin Latte accents
# are used because they stay readable on both the latte and mocha themes.
# state_text rules need herdr >= 0.9.5; 0.9.0 rejects the whole file.
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "agent", bold = true }],
  [{ token = "state_text", rules = [{ equals = "blocked", fg = "#df8e1d", bold = true }, { equals = "working", fg = "#04a5e5" }, { equals = "done", fg = "#40a02b", bold = true }, { equals = "idle", hide = true }] }, { token = "workspace", dim = true }, { token = "tab", dim = true }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "terminal_title_stripped", bold = true }],
  [{ token = "state_text", rules = [{ equals = "blocked", fg = "#df8e1d", bold = true }, { equals = "working", fg = "#04a5e5" }, { equals = "done", fg = "#40a02b", bold = true }, { equals = "idle", hide = true }] }, { token = "workspace", dim = true }, { token = "tab", dim = true }],
]

# Repo rows, like T3's project folders:
#   line 1  ● repo name   status      (name bold, status in the same T3 colours)
#   line 2  branch  git status        (muted)
# A repo's status rolls up its sessions, so "blocked" flags a repo that needs you.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", bold = true }, { token = "state_text", rules = [{ equals = "blocked", fg = "#df8e1d", bold = true }, { equals = "working", fg = "#04a5e5" }, { equals = "done", fg = "#40a02b", bold = true }, { equals = "idle", hide = true }] }],
  [{ token = "branch", dim = true }, { token = "git_status", dim = true }],
]

[experimental]
# Allow launching herdr from inside a herdr-managed pane (nested herdr).
allow_nested = true
